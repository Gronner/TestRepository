name: pre-checks

on:
  push:
    branches:
      - main
    tags:
      - v*.**
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit message
        uses: csaf-rs/shared-workflows/.github/actions/commitlint@61a2bcd6dfbb086c6d6d80e741476631348f02b6 # TODO: Update to release
